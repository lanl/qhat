[build-system]
requires = ["setuptools>=40.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhat"
version = "0.1.0"

dependencies = [
    # Dependencies required for resource estimation
    "juliacall<=0.9.28",
    "pyLIQTR>=1.4.2",
    # Dependencies required for Hamiltonian generation
    # -- basis-set-exchange is technically optional if you use a basis set already provided by pySCF
    "basis-set-exchange",
    "mendeleev",
    "openfermionpyscf",
    # Dependencies to accelerate / improve double-factorization
    # -- most or all are technically optional, but give faster or better results
    "baytune",
    "chocolate",
    "cmaes",
    #"kahypar", # Fails to install on my laptop, so commented out
    "nevergrad",
    "optuna",
    # Dependencies for fast Trotter error estimation
    "numba>=0.56.0",  # JIT compilation for jkg_utils_fast.py
]

[project.optional-dependencies]
# Backend optional dependencies
# Qualtran backend is included in base dependencies (via pyLIQTR)
# Install additional backends with: pip install qhat[backend-pennylane]
backend-pennylane = [
    "pennylane>=0.35.0",
    "pennylane-lightning>=0.35.0",
]
backend-qiskit = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
]
# Install all backends at once
backends-all = [
    "pennylane>=0.35.0",
    "pennylane-lightning>=0.35.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["qhat", "qhat.analysis", "qhat.analysis.backend", "qhat.common", "qhat.hamiltonian_generator"]
package-dir = {"qhat" = ".", "qhat.analysis" = "analysis", "qhat.analysis.backend" = "analysis/backend", "qhat.common" = "common", "qhat.hamiltonian_generator" = "hamiltonian_generator"}
