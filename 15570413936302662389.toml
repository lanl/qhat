upper_bound = -inf
exact_energy_upper_bound = false

[unitary]
method = "ramped trotter"
energy_error = 0.1837466108785
error_scale = 1.0
trotter_implementation = "flattened"
trotter_combine_terms = false
ordering_method = "group_evolve_greedy"

[algorithm]
method = "time evolution"

[analysis]
resource_estimator = "pyLIQTR"
matrix_memory_threshold_gb = 16.0
num_eigenvalues = 0
