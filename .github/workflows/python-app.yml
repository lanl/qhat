name: Python application

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

permissions:
  contents: read

# Both jobs are pinned to ubuntu-24.04 instead of ubuntu-latest. When ubuntu-latest moved to
# ubuntu-26.04 (November 2026), the pyLIQTR jobs (pauli-lcu, dbl-factor) started failing: juliapkg
# downloads and installs Julia 1.9.4, but then can't run it (`julia --version` fails), so juliapkg
# stops at `assert pr_ver is not None`. pyLIQTR requires this older Julia (~1.9); we have had
# problems updating to a newer Julia with pyLIQTR. GitHub's support for the ubuntu-24.04 runner
# is estimated to end around April 2027, so this needs revisiting before then.
jobs:
  build:
    runs-on: ubuntu-24.04  # pinned; see the note above `jobs:`
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # Ideally, QHAT should allow '3.x', but QHAT has to be pinned to
        # '3.14' until pyLIQTR (currently at 1.4.2) updates its Qualtran
        # dependency.  See https://github.com/lanl/qhat/issues/120 for the
        # discussion.
        python-version: '3.14'
        cache: 'pip'

    - name: Report versions
      run: |
        lsb_release -a
        uname -a
        python -V
        pip --version

    - name: Patch pyLIQTR wheel
      run: |
        set -euxo pipefail
        pip download --dest=python-wheels --no-deps --ignore-requires-python --no-binary :all: pyLIQTR
        cd python-wheels
        tar -xzvf pyliqtr-*.tar.gz
        plver=$(awk '/^Version:/ {print $2}' < pyliqtr-*/PKG-INFO)
        cd "pyliqtr-$plver"
        sed -i -e '/python_requires/d' setup.py
        sed -i -e '/Requires-Python:/d' PKG-INFO src/pyLIQTR.egg-info/PKG-INFO
        pip wheel --wheel-dir=.. .
        cd ../..
        rm -rf "python-wheels/pyliqtr-$plver" "python-wheels/pyliqtr-${plver}.tar.gz"

    - name: Download dependencies
      run: |
        set -euxo pipefail
        pip download --dest=python-wheels --find-links=python-wheels .

    - name: Store Python wheels
      uses: actions/upload-artifact@v7
      with:
        name: python-wheels
        path: python-wheels
        retention-days: 7

  test:
    runs-on: ubuntu-24.04  # pinned; see the note above `jobs:`
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: hamgen
            directory: hamiltonian_generator
            script: hamgen.py
            config_file: ''

          - name: analysis-trotter
            directory: analysis
            script: driver.py
            config_file: ''
            config_params: ''

          - name: analysis-pauli-lcu
            directory: analysis
            script: driver.py
            config_file: ''
            config_params: '-p method=pauli-lcu'

          - name: analysis-dbl-factor
            directory: analysis
            script: driver.py
            config_file: ''
            config_params: '-p method=double-factorization'

          - name: common-unit-tests
            directory: common
            script: pytest
            config_file: ''
            config_params: ''

          - name: analysis-unit-tests
            directory: analysis
            script: pytest
            config_file: ''
            config_params: ''

    name: Test ${{ matrix.test-suite.name }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        # See '3.14' comment above.
        python-version: '3.14'

    - name: Restore Python wheels
      uses: actions/download-artifact@v8
      with:
        name: python-wheels
        path: python-wheels

    - name: Install dependencies
      run: |
        set -euxo pipefail
        pip install --upgrade pip
        pip install --find-links=python-wheels .

    - name: Run test
      run: |
        set -euxo pipefail
        cd ${{ matrix.test-suite.directory }}
        if [ "${{ matrix.test-suite.script }}" = "pytest" ]; then
          python -m pytest tests/ -v
        else
          python ${{ matrix.test-suite.script }} ${{ matrix.test-suite.config_file }} ${{ matrix.test-suite.config_params }}
        fi
